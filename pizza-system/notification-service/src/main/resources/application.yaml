server:
  port: 8081

spring:
  application:
    name: notification-service

  spring:
    kafka:
      bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      consumer:
        group-id: pizza-notification-group
        auto-offset-reset: earliest
        key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        properties:
          # 1. Trust all packages
          spring.json.trusted.packages: "*"
          # 2. Spring to use the method parameter type instead of the TypeId header
          spring.json.value.default.type: "com.pizza.delivery.notification.dto.PizzaOrderEvent"
          spring.json.use.type.headers: false

      mongodb:
        uri: ${SPRING_MONGODB_URI:mongodb://mongodb:27017/notification_db}