services:
  postgres-db:
    image: postgres:16-alpine
    container_name: pizza-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-pizza_db}
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-pizza_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: pizza-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_INTERNAL://0.0.0.0:29094"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29094"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    restart: unless-stopped

  task-service:
    image: pizza-task-service:latest
    build:
      context: .
      dockerfile: task-service/Dockerfile
    container_name: pizza-task-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-admin}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-password}
      - CORS_ALLOWED_ORIGINS=${PUBLIC_ORIGIN:-http://localhost}
    depends_on:
      postgres-db:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped

  notification-service:
    image: pizza-notification-service:latest
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: pizza-notification-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_MONGODB_URI=mongodb://mongodb:27017/notification_db
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29094
      - CORS_ALLOWED_ORIGINS=${PUBLIC_ORIGIN:-http://localhost}
    depends_on:
      kafka:
        condition: service_started
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    container_name: pizza-mongodb
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    image: pizza-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pizza-frontend
    expose:
      - "80"
    depends_on:
      - task-service
      - notification-service
    restart: unless-stopped

  caddy:
      image: caddy:2.8-alpine
      container_name: pizza-caddy
      ports:
          - "80:80"
          - "443:443"
      environment:
          - PUBLIC_DOMAIN=${PUBLIC_DOMAIN}
          - ACME_EMAIL=${ACME_EMAIL}
      volumes:
          - ./Caddyfile:/etc/caddy/Caddyfile:ro
          - caddy_data:/data
          - caddy_config:/config
      depends_on:
          - frontend
      restart: unless-stopped

volumes:
  postgres_data:
  mongo_data:
  caddy_data:
  caddy_config: