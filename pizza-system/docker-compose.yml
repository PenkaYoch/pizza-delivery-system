version: '3.8'
services:
  # 1. Database Layer
  postgres-db:
    image: postgres:16-alpine
    container_name: pizza-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=pizza_db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d pizza_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Messaging Layer (KRaft Mode)
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: pizza-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:29093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_INTERNAL://0.0.0.0:29094'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29094'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

  # 3. Java Kitchen Module (Producer)
  task-service:
    image: pizza-task-service:latest
    build:
      context: .
      dockerfile: task-service/Dockerfile
    container_name: pizza-task-service
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker # Activates application-docker.yml settings
    depends_on:
      postgres-db:
        condition: service_healthy # Wait for database to accept connections
      kafka:
        condition: service_started

  # 4. Kotlin Notification Module (Consumer)
  notification-service:
    image: pizza-notification-service:latest
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: pizza-notification-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_MONGODB_URI=mongodb://mongodb:27017/notification_db
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29094
    depends_on:
      kafka:
        condition: service_started
      mongodb:
        condition: service_healthy

  # 5. NoSQL Database for Notification History
  mongodb:
    image: mongo:7.0
    container_name: pizza-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  mongo_data: